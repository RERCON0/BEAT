name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Formatting and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check local documentation links
        run: python -B scripts/check_docs.py
      - name: Test signed package verification and tamper rejection
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Check built-in translations and format placeholders
        run: python -B scripts/update_i18n.py --check

  windows:
    name: Windows x64 tests and optimized build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check all targets without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test API, cache, state and playback logic
        run: cargo test --locked --all-targets
      - name: Build optimized Windows app
        run: cargo build --locked --release --bin beat
      - name: Verify executable and record source revision
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/release/beat.exe -Destination dist/beat.exe
          python -B scripts/check_build.py dist/beat.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beat-windows-x64-unsigned-${{ github.sha }}
          path: |
            dist/beat.exe
            dist/BUILD.json
            dist/SHA256SUMS.txt
            dist/COMPONENT-NOTICES.txt
            dist/LICENSE
          if-no-files-found: error
          retention-days: 7
