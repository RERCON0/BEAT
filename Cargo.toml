[package]
name = "beat"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "BEAT — Navidrome cache player (GUI) by rercon prod."

[[bin]]
name = "beat"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
# eframe already pulls this in transitively to decode its own icons/textures -
# declaring it directly just lets our own code decode covers and the app icon.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
# default-features off: drops the HTTP/2 stack (h2); every endpoint we call is
# UTF-8 JSON. default-tls uses schannel on Windows; system-proxy keeps
# corporate-proxy support.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls", "system-proxy"] }
# Playback: rodio + symphonia decode mp3/flac/ogg/wav/m4a; the "play from the
# growing cache file" reader lives in player.rs. default-features off drops the
# recording stack; playback is required for the output device.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
# Tag/duration probe for local files (title, artist, album). Only reading is
# done here; playback stays in rodio. Format features mirror rodio's above.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "isomp4", "mkv"] }
# The maintained libopus adapter matching Symphonia 0.5; statically bundled.
symphonia-adapter-libopus = "0.2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
souvlaki = { version = "0.8.3", default-features = false }

[build-dependencies]
embed-resource = "3"

[patch.crates-io]
# ReadBytes must refuse excessive declared allocations before reading a body.
symphonia-core = { path = "vendor/symphonia-core" }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
# Panics must unwind: audio/image decoders run on untrusted server bytes and
# are guarded with catch_unwind (panic="abort" would kill the whole app).

[profile.release.package.epaint]
opt-level = 2

[profile.release.package.egui]
opt-level = 2

# Decoding is this app's CPU hot path while playing; size-optimizing it
# audibly stutters on high bitrates.
[profile.release.package.symphonia]
opt-level = 2

[profile.release.package.rodio]
opt-level = 2

[profile.release.package.symphonia-adapter-libopus]
opt-level = 2

[profile.release.package.opusic-sys]
opt-level = 3
